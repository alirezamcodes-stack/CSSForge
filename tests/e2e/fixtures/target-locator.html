<!doctype html><html><head><meta charset="utf-8"><title>CSSForge locator engine fixture</title><style>
body{margin:0;font:16px Arial;min-height:1200px}main{padding:50px;width:800px;min-height:400px}button{padding:12px;margin:8px;font:16px Arial}article{padding:8px;border:1px solid #ccc;margin:8px}#open-a,#open-b,#outer-host,#slot-host{display:block;margin:15px;width:600px;min-height:45px}
</style></head><body><main><!-- scene --></main><script>
for(const id of ['open-a','open-b']) { const host=document.querySelector('#'+id); if(host)host.attachShadow({mode:'open'}).innerHTML='<button id="same" style="padding:12px">'+id+'</button>'; }
const outer=document.querySelector('#outer-host');if(outer){const root=outer.attachShadow({mode:'open'});root.innerHTML='<section id="inner-host"></section><button id="same">Outer duplicate</button>';root.querySelector('#inner-host').attachShadow({mode:'open'}).innerHTML='<button id="same" style="padding:12px">Nested original</button>';}
const slot=document.querySelector('#slot-host');if(slot)slot.attachShadow({mode:'open'}).innerHTML='<slot></slot>';
</script></body></html>
